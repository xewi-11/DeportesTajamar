<app-menu-actividades></app-menu-actividades>

<div class="container mt-4">
  <div class="banner-info p-4 mb-4 rounded-4 shadow-sm">
    <div class="d-flex align-items-center mb-2">
      <div class="icon-container-main me-3">
        <i class="bi bi-people-fill"></i>
      </div>
      <h2 class="m-0 fw-bold text-dark">{{actividad.nombre}}</h2>
    </div>
    <p class="mb-0 text-muted">
      <small><i class="bi bi-person-check me-1"></i> Mínimo de jugadores: {{actividad.minimoJugadores}}</small>
    </p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0">Equipos</h3>
      <p class="text-muted small">Consulta los equipos y sus plantillas</p>
    </div>
    <button type="button" class="btn btn-create-team rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#createEquipoModal">
      + Crear Equipo
    </button>
  </div>

  <div class="row">
    @for(equipo of equiposActividad; track equipo.idEquipo) {
      <div class="col-md-6 mb-4">
        <div class="card equipo-card border-0 shadow-sm rounded-4 h-100">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div class="d-flex align-items-center">
                <div class="shield-icon me-3">
                  <i class="bi bi-shield-shaded"></i>
                </div>
                <div>
                  <h5 class="fw-bold mb-0">{{equipo.nombreEquipo}}</h5>
                  <span class="text-muted small">{{actividad.nombre}}</span>
                </div>
              </div>
              <span class="badge rounded-pill badge-members">
                <i class="bi bi-people me-1"></i> {{equipo.idEquipo}} Miembros
              </span>
            </div>

            <div class="template-section mb-4">
              <div class="d-flex justify-content-between align-items-center text-muted small pointer-link">
                <span>Ver Plantilla ({{equipo.idEquipo}})</span>
                <i class="bi bi-chevron-down"></i>
              </div>
            </div>

            <button class="btn btn-enroll w-100 rounded-3 py-2">
              <i class="bi bi-person-plus-fill me-2"></i> Inscribirse
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
