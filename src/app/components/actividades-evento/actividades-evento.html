<app-header></app-header>
<app-menu-eventos [idEvento]="idEvento"></app-menu-eventos>

<div class="d-flex flex-column min-vh-100">
  <main class="flex-grow-1 p-4 fade-in">
    <div class="container-xl">
      <div class="row g-4 align-items-start">
        <div class="col-12">
          <div class="d-flex flex-column gap-4">
            <div class="card card-custom p-3 border-0">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h2 class="h4 mb-1 fw-bold d-flex align-items-center gap-2 text-dark">
                    <i class="bi bi-trophy text-orange fs-4"></i>
                    Actividades
                  </h2>
                  <p class="text-muted small mb-0">Gestión de tipos de deporte y requisitos</p>
                </div>
                <button
                  class="btn btn-gradient d-flex align-items-center gap-2"
                  (click)="openDialog()"
                >
                  <i class="bi bi-plus-lg"></i>
                  Crear Actividad
                </button>
              </div>
            </div>

            <div class="row g-4">
              @for (actividad of actividades; track actividad.idActividad) {
              <div class="col-12 col-md-6 col-lg-4">
                <div class="card card-custom-actividades h-100">
                  <div class="card-gradient-top"></div>
                  <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                    <h3 class="h5 mb-0 fw-bold text-dark">
                      {{ actividad.nombreActividad }}
                    </h3>
                  </div>
                  <div class="card-body d-flex flex-column gap-3">
                    <div
                      class="d-flex align-items-center justify-content-between p-3 bg-light rounded-3"
                    >
                      <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-people-fill text-orange"></i>
                        <span class="fw-medium small text-muted">Mínimo:</span>
                      </div>
                      <span class="fw-bold text-dark fs-5">
                        {{ actividad.minimoJugadores }}
                      </span>
                    </div>

                    <button
                      class="btn btn-gradient w-100 mt-auto d-flex align-items-center justify-content-center gap-2"
                      (click)="
                        verDetallesActividad(
                          actividad.idEvento,
                          actividad.idActividad,
                          actividad.idEventoActividad
                        )
                      "
                    >
                      <i class="bi bi-eye"></i>
                      Ver Detalles
                    </button>
                  </div>
                </div>
              </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

@if (isDialogOpen) {
<div
  class="modal fade show d-block"
  tabindex="-1"
  role="dialog"
  style="background-color: rgba(0, 0, 0, 0.5)"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content shadow-lg">
      <div class="modal-header border-bottom-0">
        <h5 class="modal-title fw-bold">Crear Nueva Actividad</h5>
        <button type="button" class="btn-close" (click)="closeDialog()"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-4">Define el nombre y la cantidad mínima de jugadores.</p>

        <div class="mb-3">
          <label for="nombre" class="form-label small fw-bold text-secondary">
            Nombre de la Actividad *
          </label>
          <input
            id="nombre"
            type="text"
            class="form-control form-control-lg fs-6"
            [(ngModel)]="nuevaActividad.nombreActividad"
            placeholder="Ej: Fútbol Sala"
          />
        </div>

        <div class="mb-4">
          <label for="minimo" class="form-label small fw-bold text-secondary">
            Mínimo de Jugadores *
          </label>
          <input
            id="minimo"
            type="number"
            class="form-control form-control-lg fs-6"
            [(ngModel)]="nuevaActividad.minimoJugadores"
            placeholder="Ej: 5"
          />
        </div>

        <div class="d-flex gap-2">
          <button (click)="handleCrearActividad()" class="btn btn-gradient flex-fill py-2">
            Guardar
          </button>
          <button (click)="closeDialog()" class="btn btn-light text-muted border flex-fill py-2">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
}
