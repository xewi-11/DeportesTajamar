<div class="d-flex justify-content-center w-100 my-4">
  <div class="tabs-container d-flex align-items-center">
    <button class="btn-volver d-flex align-items-center me-3">
      <a class="nav-link" [routerLink]="['/eventos']"
        ><i class="bi bi-arrow-left me-1"></i> Volver</a
      >
    </button>

    <ul class="nav nav-pills custom-tabs p-2">
      <li class="nav-item">
        <a
          class="nav-link"
          [routerLink]="[`/detallesEvento/${eventId}`]"
          [class.active]="opcionSeleccionada === 'detalles'"
          >Detalles</a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          [routerLink]="[`/actividadesEvento/${eventId}`]"
          [class.active]="opcionSeleccionada === 'actividades'"
          >Actividades</a
        >
      </li>
    </ul>
  </div>
</div>
