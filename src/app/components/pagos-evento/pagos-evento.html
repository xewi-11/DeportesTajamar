<app-header></app-header>
<app-menu-eventos [idEvento]="idEvento"></app-menu-eventos>

<div class="space-y-6 p-4">
  <div>
    <h2 class="text-3xl font-bold">Estado de Pagos</h2>
  </div>

  <div class="rounded-xl border bg-card text-card-foreground shadow bg-white">
    <div class="pt-6 p-6">
      <div class="relative w-full overflow-auto">
        <table class="w-full caption-bottom text-sm">
          <thead class="[&_tr]:border-b">
            <tr class="border-b transition-colors hover:bg-muted/50 data-[state=selected]:bg-muted">
              <th
                class="h-12 px-4 text-left align-middle font-medium text-muted-foreground w-[40%]"
              >
                Curso
              </th>
              <th
                class="h-12 px-4 text-left align-middle font-medium text-muted-foreground w-[30%]"
              >
                Cantidad
              </th>
              <th
                class="h-12 px-4 text-left align-middle font-medium text-muted-foreground w-[30%]"
              >
                Estado
              </th>
            </tr>
          </thead>

          <tbody class="[&_tr:last-child]:border-0">
            @for (curso of datosTabla; track curso.id) {
            <tr class="border-b transition-colors hover:bg-muted/50 data-[state=selected]:bg-muted">
              <td class="p-4 align-middle">
                <div class="flex items-center gap-3">
                  <div class="p-2 bg-blue-100/50 rounded-lg text-blue-600">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
                      />
                      <path d="M22 10v6" />
                      <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
                    </svg>
                  </div>
                  <span class="font-semibold">{{ curso.nombre }}</span>
                </div>
              </td>

              <td class="p-4 align-middle font-bold text-lg text-foreground">
                {{ curso.cantidadTotal | currency : 'USD' : 'symbol' : '1.0-0' }}
              </td>

              <td class="p-4 align-middle">
                @switch (curso.estadoFinal) { @case ('Pagado') {
                <div
                  class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent bg-green-100 text-green-800 hover:bg-green-200 border-green-300 px-4 py-1"
                >
                  <svg
                    class="w-3 h-3 mr-2"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <path d="m9 12 2 2 4-4" />
                  </svg>
                  Pagado
                </div>
                } @case ('Sin pagar') {
                <div
                  class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent bg-red-100 text-red-800 hover:bg-red-200 border-red-200 px-4 py-1"
                >
                  <svg
                    class="w-3 h-3 mr-2"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" x2="12" y1="8" y2="12" />
                    <line x1="12" x2="12.01" y1="16" y2="16" />
                  </svg>
                  Sin pagar
                </div>
                } @case ('Exento') {
                <div
                  class="inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent bg-slate-100 text-slate-600 hover:bg-slate-200 border-slate-200 px-4 py-1"
                >
                  <svg
                    class="w-3 h-3 mr-2"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <path d="M12 17h.01" />
                  </svg>
                  Exento
                </div>
                } }
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
