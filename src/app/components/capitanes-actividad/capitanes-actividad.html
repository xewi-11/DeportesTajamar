
<app-menu-actividades></app-menu-actividades>

<div class="container mt-4">
  <div class="banner-info p-4 mb-4 rounded-4 shadow-sm">
    <div class="d-flex align-items-center mb-2">
      <div class="icon-container-main me-3">
        <i class="bi bi-people-fill"></i>
      </div>
      <h2 class="m-0 fw-bold text-dark">{{ actividad.nombre }}</h2>
    </div>
    <p class="mb-0 text-muted">
      <small>
        <i class="bi bi-person-check me-1"></i> Mínimo de jugadores:
        {{ actividad.minimoJugadores }}
      </small>
    </p>
  </div>

  <h2 class="fw-bold mb-2">Capitán</h2>
  <p class="text-muted mb-4">Selecciona el capitán de esta actividad</p>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      @if (selectedCapitan && getSelectedUser()) {
        <div class="alert alert-info d-flex align-items-center mb-4">
          <i class="bi bi-star-fill me-2"></i>
          <strong>Capitán actual: {{ getSelectedUser()?.usuario }}</strong>
        </div>
      }

      <div class="mb-3">
        <label class="form-label fw-medium">
          <i class="bi bi-person-badge me-2"></i>Seleccionar capitán
        </label>
        <select
          class="form-select form-select-lg"
          [value]="selectedCapitan || 0"
          (change)="onSelectChange($event)"
        >
          <option [value]="0">Seleccionar capitán...</option>
          @for (usuario of usuariosDisponibles; track usuario.idUsuario) {
            <option [value]="usuario.idUsuario" [selected]="usuario.idUsuario === selectedCapitan">
              {{ usuario.usuario }} - {{ usuario.curso }}
            </option>
          }
        </select>
      </div>

      <div class="text-muted small mt-3">
        <i class="bi bi-info-circle me-1"></i>
        {{ usuariosDisponibles.length }} candidatos disponibles
      </div>
    </div>
  </div>
</div>
